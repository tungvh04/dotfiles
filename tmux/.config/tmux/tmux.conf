# ---------- General ----------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10        # snappy <Esc> in nvim
set -g focus-events on        # nvim autoread
setw -g mode-keys vi

# ---------- Prefix: C-a ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---------- Splits & windows (keep current path) ----------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---------- Pane navigation (vim-style) ----------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------- Session switcher (fzf popup) ----------
bind s display-popup -E -w 80% -h 60% "~/.config/tmux/scripts/tmux-session-switcher-fzf.sh"

# ---------- Copy mode (vi) ----------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------- Status bar (One Dark palette, matches nvim) ----------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#282c34,fg=#abb2bf"
set -g status-left-length 30
set -g status-left "#[bg=#98c379,fg=#282c34,bold] #S #[default] "
set -g status-right "#[fg=#5c6370]%Y-%m-%d #[fg=#61afef]%H:%M "
setw -g window-status-format "#[fg=#5c6370] #I:#W "
setw -g window-status-current-format "#[bg=#3e4452,fg=#e5c07b,bold] #I:#W#{?window_zoomed_flag, 󰊓,} "
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#61afef"
set -g message-style "bg=#3e4452,fg=#e5c07b,fill=#3e4452"  # fill clears the status line behind the prompt
setw -g mode-style "bg=#3e4452,fg=#e5c07b"
